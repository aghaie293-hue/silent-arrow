<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silent Arrows - Trajectory & Biomechanics</title>
    
    <!-- MediaPipe Pose & Camera Utils -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

    <style>
        body {
            margin: 0;
            background-color: #0d1117;
            color: #ffffff;
            font-family: Tahoma, 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 8px;
            box-sizing: border-box;
        }
        h2 { 
            margin: 4px 0 8px 0; 
            font-size: 15px;
            color: #00e676;
            text-align: center;
        }
        .camera-container {
            position: relative;
            width: 95vw;
            max-width: 480px;
            aspect-ratio: 9/16;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
            border: 1px solid #30363d;
        }
        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .controls {
            margin-top: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            width: 95vw;
            max-width: 480px;
        }
        button {
            padding: 9px 10px;
            font-size: 12px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            transition: 0.15s;
            flex: 1 1 45%;
        }
        .btn-start { background-color: #00c853; flex: 1 1 100%; font-size: 14px; }
        .btn-cam { background-color: #2979ff; flex: 0 0 44px; min-width: 44px; font-size: 16px; }
        .btn-snap { background-color: #e91e63; }
        .btn-trail { background-color: #607d8b; }
        .btn-trail.active { background-color: #00e5ff; color: #000; }
        .btn-log { background-color: #ff9100; }
        .btn-export { background-color: #aa00ff; }
        button:active { transform: scale(0.96); }

        .dashboard {
            margin-top: 8px;
            width: 95vw;
            max-width: 480px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
            font-size: 12px;
        }
        .card {
            background: #161b22;
            padding: 6px 10px;
            border-radius: 6px;
            border-right: 4px solid #00e676;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card.warn {
            border-right-color: #ff3d00;
        }
        .card-val {
            font-weight: bold;
            font-family: monospace;
            font-size: 13px;
        }
        #log-status {
            font-size: 12px;
            color: #ffea00;
            margin-top: 4px;
            text-align: center;
            min-height: 16px;
        }
    </style>
</head>
<body>

    <h2>پروژه سایلنت اررو | آنالیز زوایا و رد حرکت (Motion Tracer)</h2>
    
    <div class="camera-container">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="output_canvas"></canvas>
    </div>

    <!-- دکمه‌های کنترل، ثبت و ردیابی حرکت -->
    <div class="controls">
        <button id="startBtn" class="btn-start" onclick="initApp()">شروع آنالیز بیومکانیک 🏹</button>
        <button id="switchBtn" class="btn-cam" style="display: none;" onclick="toggleCamera()" title="تغییر دوربین">🔄</button>
        <button id="trailBtn" class="btn-trail" style="display: none;" onclick="toggleTracking()">ردیابی مسیر حرکت 궤: خاموش</button>
        <button id="snapBtn" class="btn-snap" style="display: none;" onclick="captureSnapshot()">عکس لحظه‌ای 📸</button>
        <button id="logBtn" class="btn-log" style="display: none;" onclick="logCurrentShot()">ثبت وضعیت تیر 🎯 (0)</button>
        <button id="exportBtn" class="btn-export" style="display: none;" onclick="downloadCSV()">خروجی اکسل / CSV 📥</button>
    </div>

    <div id="log-status"></div>

    <!-- داشبورد نمایش عددی زوایا -->
    <div class="dashboard" id="dashboard" style="display: none;">
        <div class="card" id="cardShoulder">
            <span>تراز شانه:</span>
            <span class="card-val" id="valShoulder">--</span>
        </div>
        <div class="card" id="cardSpine">
            <span>شیب تنه:</span>
            <span class="card-val" id="valSpine">--</span>
        </div>
        <div class="card" id="cardDrawElbow">
            <span>آرنج کشش:</span>
            <span class="card-val" id="valDrawElbow">--</span>
        </div>
        <div class="card" id="cardBowElbow">
            <span>آرنج کمان:</span>
            <span class="card-val" id="valBowElbow">--</span>
        </div>
        <div class="card" id="cardDrawWrist">
            <span>مچ کشش:</span>
            <span class="card-val" id="valDrawWrist">--</span>
        </div>
        <div class="card" id="cardBowWrist">
            <span>مچ کمان:</span>
            <span class="card-val" id="valBowWrist">--</span>
        </div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('output_canvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('startBtn');
        const switchBtn = document.getElementById('switchBtn');
        const snapBtn = document.getElementById('snapBtn');
        const trailBtn = document.getElementById('trailBtn');
        const logBtn = document.getElementById('logBtn');
        const exportBtn = document.getElementById('exportBtn');
        const dashboard = document.getElementById('dashboard');
        const logStatus = document.getElementById('log-status');

        let currentFacingMode = "user";
        let camera = null;
        let pose = null;

        let frameCount = 0;
        let currentFps = 0;
        let lastFpsTime = performance.now();

        let lastPoseData = null;
        let sessionLogs = [];

        // وضعیت ردیابی مسیر حرکت مفاصل
        let isTrackingEnabled = false;
        const MAX_TRAIL_LENGTH = 45; // طول تاریخچه رد خطوط
        const jointTrails = {
            drawElbow: [],   // لندمارک 14 (آرنج دست راست)
            drawWrist: [],   // لندمارک 16 (مچ دست راست)
            drawIndex: [],   // لندمارک 20 (انگشت دست راست)
            bowWrist: [],    // لندمارک 15 (مچ دست چپ)
            bowElbow: []     // لندمارک 13 (آرنج دست چپ)
        };

        function toggleTracking() {
            isTrackingEnabled = !isTrackingEnabled;
            if (isTrackingEnabled) {
                trailBtn.classList.add('active');
                trailBtn.innerText = "ردیابی مسیر حرکت 궤: روشن";
                // پاکسازی مسیرهای قبلی
                for (let k in jointTrails) jointTrails[k] = [];
            } else {
                trailBtn.classList.remove('active');
                trailBtn.innerText = "ردیابی مسیر حرکت 궤: خاموش";
                for (let k in jointTrails) jointTrails[k] = [];
            }
        }

        async function initApp() {
            startBtn.innerText = "در حال بارگذاری مدل هوش مصنوعی...";
            startBtn.disabled = true;

            pose = new Pose({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
            });

            pose.setOptions({
                modelComplexity: 1,
                smoothLandmarks: true,
                enableSegmentation: false,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            pose.onResults(onPoseResults);

            setupCamera();
        }

        function setupCamera() {
            if (camera) camera.stop();

            camera = new Camera(video, {
                onFrame: async () => {
                    await pose.send({ image: video });
                },
                width: 720,
                height: 1280,
                facingMode: currentFacingMode
            });

            camera.start();
            startBtn.style.display = 'none';
            switchBtn.style.display = 'inline-block';
            trailBtn.style.display = 'inline-block';
            snapBtn.style.display = 'inline-block';
            logBtn.style.display = 'inline-block';
            exportBtn.style.display = 'inline-block';
            dashboard.style.display = 'grid';
        }

        function toggleCamera() {
            currentFacingMode = (currentFacingMode === "user") ? "environment" : "user";
            for (let k in jointTrails) jointTrails[k] = [];
            setupCamera();
        }

        function calculateAngle(A, B, C) {
            const rad = Math.atan2(C.y - B.y, C.x - B.x) - Math.atan2(A.y - B.y, A.x - B.x);
            let deg = Math.abs((rad * 180.0) / Math.PI);
            if (deg > 180.0) deg = 360.0 - deg;
            return Math.round(deg);
        }

        function drawBone(p1, p2, color = "rgba(0, 230, 118, 0.7)", width = 3) {
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.stroke();
        }

        function drawJoint(p, color = "#ffffff", radius = 5) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, radius, 0, 2 * Math.PI);
            ctx.fill();
        }

        // نمایش برچسب عددی زوایا به صورت کادر شیشه‌ای برجسته روی هر مفصل
        function drawAngleLabel(x, y, text, bgColor = "rgba(0, 0, 0, 0.75)", textColor = "#00e676") {
            ctx.font = "bold 13px monospace";
            const textWidth = ctx.measureText(text).width;
            const padX = 6, padY = 4;
            
            ctx.fillStyle = bgColor;
            ctx.fillRect(x - padX, y - 14 - padY, textWidth + (padX * 2), 18 + padY);
            
            ctx.fillStyle = textColor;
            ctx.fillText(text, x, y);
        }

        // رسم رد خطوط حرکتی مفصل‌ها با محو شدن تدریجی (Trailing)
        function renderTrail(points, colorRgb) {
            if (points.length < 2) return;
            for (let i = 1; i < points.length; i++) {
                const alpha = (i / points.length).toFixed(2);
                ctx.strokeStyle = `rgba(${colorRgb}, ${alpha})`;
                ctx.lineWidth = Math.max(1.5, (i / points.length) * 4);
                ctx.beginPath();
                ctx.moveTo(points[i - 1].x, points[i - 1].y);
                ctx.lineTo(points[i].x, points[i].y);
                ctx.stroke();
            }
        }

        function onPoseResults(results) {
            const now = performance.now();
            frameCount++;
            if (now - lastFpsTime >= 500) {
                currentFps = Math.round((frameCount * 1000) / (now - lastFpsTime));
                frameCount = 0;
                lastFpsTime = now;
            }

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const w = canvas.width;
            const h = canvas.height;

            ctx.clearRect(0, 0, w, h);

            if (!results.poseLandmarks) {
                lastPoseData = null;
                return;
            }

            const lm = results.poseLandmarks.map(p => ({
                x: p.x * w,
                y: p.y * h,
                vis: p.visibility
            }));

            // رسم اسکلت کامل بدن
            const skeletonPairs = [
                [11, 12], [11, 23], [12, 24], [23, 24],
                [11, 13], [13, 15], [15, 17], [15, 19], [15, 21], // دست کمان و مچ و انگشتان
                [12, 14], [14, 16], [16, 18], [16, 20], [16, 22], // دست کشش و مچ و انگشتان
                [23, 25], [25, 27],
                [24, 26], [26, 28]
            ];

            skeletonPairs.forEach(([i, j]) => {
                if (lm[i].vis > 0.4 && lm[j].vis > 0.4) {
                    drawBone(lm[i], lm[j], "rgba(255, 255, 255, 0.35)", 2);
                }
            });

            for (let i = 11; i <= 22; i++) {
                if (lm[i].vis > 0.4) {
                    drawJoint(lm[i], "#00e676", 4);
                }
            }

            // متغیرهای زاویه
            let shoulderTiltVal = null;
            let spineLeanVal = null;
            let drawElbowVal = null;
            let bowElbowVal = null;
            let drawWristVal = null;
            let bowWristVal = null;

            // ۱. تراز شانه
            if (lm[11].vis > 0.5 && lm[12].vis > 0.5) {
                const dy = lm[12].y - lm[11].y;
                const dx = lm[12].x - lm[11].x;
                const shoulderSlope = Math.abs((Math.atan2(dy, dx) * 180) / Math.PI);
                shoulderTiltVal = parseFloat(Math.abs(180 - shoulderSlope).toFixed(2));

                const isBalanced = shoulderTiltVal <= 3.5;
                drawBone(lm[11], lm[12], isBalanced ? "#00e676" : "#ff3d00", 4);

                const midX = (lm[11].x + lm[12].x) / 2;
                const midY = (lm[11].y + lm[12].y) / 2 - 12;
                drawAngleLabel(midX, midY, `${shoulderTiltVal}°`, "rgba(0,0,0,0.8)", isBalanced ? "#00e676" : "#ff3d00");

                document.getElementById('valShoulder').innerText = `${shoulderTiltVal}° ${isBalanced ? '✓' : '▲'}`;
                document.getElementById('cardShoulder').className = isBalanced ? "card" : "card warn";
            }

            // ۲. شیب تنه
            if (lm[11].vis > 0.5 && lm[12].vis > 0.5 && lm[23].vis > 0.5 && lm[24].vis > 0.5) {
                const midShoulder = { x: (lm[11].x + lm[12].x) / 2, y: (lm[11].y + lm[12].y) / 2 };
                const midHip = { x: (lm[23].x + lm[24].x) / 2, y: (lm[23].y + lm[24].y) / 2 };

                const spineDy = midHip.y - midShoulder.y;
                const spineDx = midHip.x - midShoulder.x;
                const spineAngle = Math.abs((Math.atan2(spineDy, spineDx) * 180) / Math.PI);
                spineLeanVal = parseFloat(Math.abs(90 - spineAngle).toFixed(2));

                const spineOk = spineLeanVal <= 4.0;
                drawBone(midShoulder, midHip, spineOk ? "#00e676" : "#ff9100", 3);

                document.getElementById('valSpine').innerText = `${spineLeanVal}° ${spineOk ? '✓' : '!'}`;
                document.getElementById('cardSpine').className = spineOk ? "card" : "card warn";
            }

            // ۳. آرنج و مچ کشش (سمت راست: ۱۲ شانه، ۱۴ آرنج، ۱۶ مچ، ۲۰ انگشت)
            if (lm[12].vis > 0.5 && lm[14].vis > 0.5 && lm[16].vis > 0.5) {
                drawElbowVal = calculateAngle(lm[12], lm[14], lm[16]);
                drawBone(lm[12], lm[14], "#2979ff", 3);
                drawBone(lm[14], lm[16], "#2979ff", 3);
                drawAngleLabel(lm[14].x + 10, lm[14].y, `${drawElbowVal}°`, "rgba(10,25,50,0.85)", "#64b5f6");
                document.getElementById('valDrawElbow').innerText = `${drawElbowVal}°`;

                // زاویه مچ به انگشتان
                if (lm[20] && lm[20].vis > 0.4) {
                    drawWristVal = calculateAngle(lm[14], lm[16], lm[20]);
                    drawAngleLabel(lm[16].x + 10, lm[16].y, `${drawWristVal}°`, "rgba(0,40,20,0.85)", "#a7ffeb");
                    document.getElementById('valDrawWrist').innerText = `${drawWristVal}°`;
                }
            }

            // ۴. آرنج و مچ کمان (سمت چپ: ۱۱ شانه، ۱۳ آرنج، ۱۵ مچ، ۱۹ انگشت)
            if (lm[11].vis > 0.5 && lm[13].vis > 0.5 && lm[15].vis > 0.5) {
                bowElbowVal = calculateAngle(lm[11], lm[13], lm[15]);
                drawBone(lm[11], lm[13], "#00bcd4", 3);
                drawBone(lm[13], lm[15], "#00bcd4", 3);
                drawAngleLabel(lm[13].x - 45, lm[13].y, `${bowElbowVal}°`, "rgba(0,30,40,0.85)", "#80deea");
                document.getElementById('valBowElbow').innerText = `${bowElbowVal}°`;

                if (lm[19] && lm[19].vis > 0.4) {
                    bowWristVal = calculateAngle(lm[13], lm[15], lm[19]);
                    drawAngleLabel(lm[15].x - 45, lm[15].y, `${bowWristVal}°`, "rgba(0,40,20,0.85)", "#b9f6ca");
                    document.getElementById('valBowWrist').innerText = `${bowWristVal}°`;
                }
            }

            // ================= ردیابی و ترسیم خطوط حرکت (Tracer) =================
            if (isTrackingEnabled) {
                // ثبت نقاط در تاریخچه
                if (lm[14].vis > 0.4) jointTrails.drawElbow.push({ x: lm[14].x, y: lm[14].y });
                if (lm[16].vis > 0.4) jointTrails.drawWrist.push({ x: lm[16].x, y: lm[16].y });
                if (lm[20] && lm[20].vis > 0.4) jointTrails.drawIndex.push({ x: lm[20].x, y: lm[20].y });
                if (lm[15].vis > 0.4) jointTrails.bowWrist.push({ x: lm[15].x, y: lm[15].y });
                if (lm[13].vis > 0.4) jointTrails.bowElbow.push({ x: lm[13].x, y: lm[13].y });

                // محدود کردن طول آرایه‌ها
                for (let k in jointTrails) {
                    if (jointTrails[k].length > MAX_TRAIL_LENGTH) {
                        jointTrails[k].shift();
                    }
                }

                // رسم رد نوری هر مفصل با رنگ متمایز
                renderTrail(jointTrails.drawElbow, "41, 121, 255");   // آبی روشن برای آرنج کشش
                renderTrail(jointTrails.drawWrist, "255, 64, 129");   // صورتی نئونی برای مچ دست کشش
                renderTrail(jointTrails.drawIndex, "255, 234, 0");    // زرد برای انگشتان کشش / رهایی
                renderTrail(jointTrails.bowWrist, "0, 229, 255");     // فیروزه‌ای برای مچ دست کمان
                renderTrail(jointTrails.bowElbow, "0, 230, 118");     // سبز برای آرنج کمان
            }

            lastPoseData = {
                shoulderTilt: shoulderTiltVal,
                spineLean: spineLeanVal,
                drawElbow: drawElbowVal,
                bowElbow: bowElbowVal,
                drawWrist: drawWristVal,
                bowWrist: bowWristVal,
                fps: currentFps
            };

            // نمایش FPS
            ctx.fillStyle = "rgba(0, 0, 0, 0.65)";
            ctx.fillRect(8, 8, 120, 36);
            ctx.fillStyle = "#00e676";
            ctx.font = "bold 13px Tahoma";
            ctx.direction = "ltr";
            ctx.fillText(`AI FPS: ${currentFps}`, 15, 30);
        }

        // ================= توابع عکس‌برداری، لاگ و خروجی =================

        function captureSnapshot() {
            if (!video.videoWidth) return;

            const snapCanvas = document.createElement('canvas');
            snapCanvas.width = video.videoWidth;
            snapCanvas.height = video.videoHeight;
            const snapCtx = snapCanvas.getContext('2d');

            snapCtx.drawImage(video, 0, 0, snapCanvas.width, snapCanvas.height);
            snapCtx.drawImage(canvas, 0, 0, snapCanvas.width, snapCanvas.height);

            const imageURL = snapCanvas.toDataURL('image/png');
            const downloadLink = document.createElement('a');
            const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
            
            downloadLink.href = imageURL;
            downloadLink.download = `SilentArrows_Shot_${timestamp}.png`;
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);

            logStatus.innerText = "📸 عکس با تمام زوایا و خطوط حرکتی در گالری ذخیره شد!";
            setTimeout(() => { logStatus.innerText = ""; }, 3000);
        }

        function logCurrentShot() {
            if (!lastPoseData || lastPoseData.shoulderTilt === null) {
                logStatus.innerText = "⚠️ وضعیت کامل شناسایی نشده است!";
                return;
            }

            const shotNumber = sessionLogs.length + 1;
            const now = new Date();
            const timeStr = now.toTimeString().split(' ')[0];

            const entry = {
                shot: shotNumber,
                time: timeStr,
                shoulderTilt: lastPoseData.shoulderTilt,
                spineLean: lastPoseData.spineLean,
                drawElbow: lastPoseData.drawElbow,
                bowElbow: lastPoseData.bowElbow,
                drawWrist: lastPoseData.drawWrist || "--",
                bowWrist: lastPoseData.bowWrist || "--",
                fps: lastPoseData.fps
            };

            sessionLogs.push(entry);
            logBtn.innerText = `ثبت وضعیت تیر 🎯 (${shotNumber})`;
            logStatus.innerText = `✓ تیر ${shotNumber} ثبت شد (آرنج: ${entry.drawElbow}° | مچ: ${entry.drawWrist}°)`;

            setTimeout(() => { logStatus.innerText = ""; }, 3000);
        }

        function downloadCSV() {
            if (sessionLogs.length === 0) {
                alert("هنوز تیری ثبت نشده است. ابتدا روی 'ثبت وضعیت تیر' بزنید.");
                return;
            }

            let csvContent = "\uFEFF";
            csvContent += "Shot_Number,Time,Shoulder_Tilt_Deg,Spine_Lean_Deg,Draw_Elbow_Deg,Bow_Elbow_Deg,Draw_Wrist_Deg,Bow_Wrist_Deg,FPS\n";

            sessionLogs.forEach(r => {
                csvContent += `${r.shot},${r.time},${r.shoulderTilt},${r.spineLean},${r.drawElbow},${r.bowElbow},${r.drawWrist},${r.bowWrist},${r.fps}\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            const dateStr = new Date().toISOString().slice(0, 10);
            
            link.setAttribute("href", url);
            link.setAttribute("download", `SilentArrows_Session_${dateStr}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
