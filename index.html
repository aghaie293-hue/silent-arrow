<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Silent Arrows Analyzer | آنالیز بیومکانیک ریکرو</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 12px;
            background-color: #0d1117;
            color: #e6edf3;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Tahoma, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* لایه قفل اختصاصی */
        #authOverlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: #090d13;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .auth-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 24px;
            width: 100%;
            max-width: 320px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .auth-card h3 { margin: 0 0 16px; color: #00e676; font-size: 1.15rem; }
        .auth-input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #30363d;
            background: #0d1117;
            color: #fff;
            font-size: 16px;
            text-align: center;
            outline: none;
            margin-bottom: 14px;
        }
        .auth-input:focus { border-color: #00e676; }
        .auth-btn {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: #00c853;
            color: #fff;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }
        .auth-btn:active { background: #009624; }
        #authError { color: #ff5252; margin-top: 10px; font-size: 13px; font-weight: 500; }

        /* استایل اپلیکیشن */
        h2 { margin: 10px 0 14px; font-size: 1.2rem; color: #58a6ff; }
        .camera-container {
            position: relative;
            width: 95vw;
            max-width: 640px;
            aspect-ratio: 4/3;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #30363d;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }
        video, canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
        }
        .controls {
            margin-top: 16px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            background-color: #00c853;
            color: #fff;
            border: none;
            padding: 11px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }
        .btn-alt { background-color: #2196f3; }
        .btn:active { opacity: 0.85; }
    </style>
</head>
<body>

    <!-- صفحه قفل امنیتی -->
    <div id="authOverlay">
        <div class="auth-card">
            <h3>🏹 Silent Arrows</h3>
            <p style="font-size: 12px; color: #8b949e; margin-bottom: 16px;">ورود اختصاصی ورزشکار</p>
            <input type="password" id="passInput" class="auth-input" placeholder="رمز عبور..." autocomplete="off">
            <button class="auth-btn" onclick="checkAccess()">ورود به سامانه</button>
            <div id="authError"></div>
        </div>
    </div>

    <!-- بدنه اصلی پروژه -->
    <h2>پروژه سایلنت اررو | آنالیز بیومکانیک</h2>
    <div class="camera-container">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="output_canvas"></canvas>
    </div>

    <div class="controls">
        <button id="startBtn" class="btn" onclick="startCamera()">روشن کردن دوربین</button>
        <button id="flipBtn" class="btn btn-alt" style="display:none;" onclick="toggleCamera()">تغییر دوربین</button>
    </div>

    <script>
        // هش امنیتی رمز عبور شما (SHA-256)
        const SECURE_HASH = "5f64f5aa23cc4318a925608861b31455e409bee91daafde093c538897dae9241";

        async function sha256(str) {
            const buffer = new TextEncoder().encode(str);
            const hashBuffer = await crypto.subtle.digest("SHA-256", buffer);
            return Array.from(new Uint8Array(hashBuffer))
                        .map(b => b.toString(16).padStart(2, '0'))
                        .join('');
        }

        async function checkAccess() {
            const inputVal = document.getElementById('passInput').value;
            const inputHash = await sha256(inputVal);

            if (inputHash === SECURE_HASH) {
                localStorage.setItem("sa_auth_token", "authorized_user");
                document.getElementById('authOverlay').style.display = 'none';
            } else {
                document.getElementById('authError').innerText = "رمز عبور نادرست است!";
            }
        }

        // بررسی اینکه اگر قبلاً وارد شده‌اید، نیازی به تایپ مجدد نباشد
        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem("sa_auth_token") === "authorized_user") {
                document.getElementById('authOverlay').style.display = 'none';
            }
            // اتصال کلید Enter در فیلد رمز
            document.getElementById('passInput').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') checkAccess();
            });
        });

        // مدیریت دوربین
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('output_canvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('startBtn');
        const flipBtn = document.getElementById('flipBtn');
        let currentFacingMode = "environment"; // شروع با دوربین پشت برای تمرین ریکرو

        async function startCamera() {
            try {
                if (video.srcObject) {
                    video.srcObject.getTracks().forEach(track => track.stop());
                }

                const constraints = {
                    video: {
                        facingMode: currentFacingMode,
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                };

                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                
                video.onloadedmetadata = () => {
                    video.play();
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    startBtn.style.display = 'none';
                    flipBtn.style.display = 'inline-block';
                    drawGuideOverlay();
                };
            } catch (err) {
                console.error("Camera Error:", err);
                alert("خطا در اتصال به دوربین!\nحتماً از لینک معتبر HTTPS در GitHub Pages استفاده کنید و دسترسی مرورگر را تأیید نمایید.");
            }
        }

        function toggleCamera() {
            currentFacingMode = (currentFacingMode === "user") ? "environment" : "user";
            startCamera();
        }

        function drawGuideOverlay() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const w = canvas.width;
            const h = canvas.height;

            // ترسیم خطوط تراز بیومکانیک (شانه و سر طبق لری وایز)
            ctx.strokeStyle = "#00e676";
            ctx.lineWidth = 3;
            
            // مستطیل راهنمای بالاتنه
            ctx.strokeRect(w * 0.15, h * 0.1, w * 0.7, h * 0.8);
            
            // خط تراز شانه (Shoulder Line)
            ctx.setLineDash([6, 6]);
            ctx.strokeStyle = "#58a6ff";
            ctx.beginPath();
            ctx.moveTo(w * 0.1, h * 0.35);
            ctx.lineTo(w * 0.9, h * 0.35);
            ctx.stroke();
            ctx.setLineDash([]);

            requestAnimationFrame(drawGuideOverlay);
        }
    </script>
</body>
</html>
