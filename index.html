<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silent Arrows - Biomechanics AI</title>
    
    <!-- کتابخانه‌های هوش مصنوعی MediaPipe Pose -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

    <style>
        body {
            margin: 0;
            background-color: #121212;
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h2 { 
            margin-bottom: 8px; 
            font-size: 17px;
            color: #00e676;
        }
        .camera-container {
            position: relative;
            width: 94vw;
            max-width: 600px;
            aspect-ratio: 3/4;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #333;
        }
        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .controls {
            margin-top: 12px;
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 18px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            transition: 0.2s;
        }
        .btn-green { background-color: #00c853; }
        .btn-blue { background-color: #2979ff; }
        button:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <h2>پروژه سایلنت اررو | آنالیز بیومکانیک ریکرو</h2>
    
    <div class="camera-container">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="output_canvas"></canvas>
    </div>

    <div class="controls">
        <button id="startBtn" class="btn-green" onclick="initApp()">روشن کردن هوش مصنوعی 🎯</button>
        <button id="switchBtn" class="btn-blue" style="display: none;" onclick="toggleCamera()">تغییر دوربین 🔄</button>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('output_canvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('startBtn');
        const switchBtn = document.getElementById('switchBtn');

        let currentFacingMode = "user"; // پیش‌فرض سلفی
        let camera = null;
        let pose = null;

        // متغیرهای FPS
        let frameCount = 0;
        let currentFps = 0;
        let lastFpsTime = performance.now();

        async function initApp() {
            startBtn.innerText = "در حال بارگذاری مدل هوش مصنوعی...";
            startBtn.disabled = true;

            // راه‌اندازی MediaPipe Pose
            pose = new Pose({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
            });

            pose.setOptions({
                modelComplexity: 1, // 0=سریع‌ترین، 1=متعادل، 2=بسیار دقیق
                smoothLandmarks: true,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            pose.onResults(onPoseResults);

            setupCamera();
        }

        function setupCamera() {
            if (camera) camera.stop();

            camera = new Camera(video, {
                onFrame: async () => {
                    await pose.send({ image: video });
                },
                width: 640,
                height: 480,
                facingMode: currentFacingMode
            });

            camera.start();
            startBtn.style.display = 'none';
            switchBtn.style.display = 'inline-block';
        }

        function toggleCamera() {
            currentFacingMode = (currentFacingMode === "user") ? "environment" : "user";
            setupCamera();
        }

        // تابع محاسبه زاویه سه نقطه
        function findAngle(p1, p2, p3) {
            const radians = Math.atan2(p3.y - p2.y, p3.x - p2.x) - Math.atan2(p1.y - p2.y, p1.x - p2.x);
            let angle = Math.abs((radians * 180.0) / Math.PI);
            if (angle > 180.0) angle = 360 - angle;
            return Math.round(angle);
        }

        function onPoseResults(results) {
            // محاسبه FPS
            const now = performance.now();
            frameCount++;
            if (now - lastFpsTime >= 500) {
                currentFps = Math.round((frameCount * 1000) / (now - lastFpsTime));
                frameCount = 0;
                lastFpsTime = now;
            }

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const w = canvas.width;
            const h = canvas.height;

            ctx.clearRect(0, 0, w, h);

            if (results.poseLandmarks) {
                const lm = results.poseLandmarks;

                // نقاط کلیدی شانه (11: چپ, 12: راست)
                const leftShoulder = { x: lm[11].x * w, y: lm[11].y * h, vis: lm[11].visibility };
                const rightShoulder = { x: lm[12].x * w, y: lm[12].y * h, vis: lm[12].visibility };

                // اگر هر دو شانه قابل رویت بودند
                if (leftShoulder.vis > 0.5 && rightShoulder.vis > 0.5) {
                    // محاسبه زاویه شیب شانه نسبت به افق
                    const deltaY = rightShoulder.y - leftShoulder.y;
                    const deltaX = rightShoulder.x - leftShoulder.x;
                    const shoulderAngle = Math.abs((Math.atan2(deltaY, deltaX) * 180) / Math.PI);
                    const tiltError = Math.abs(180 - shoulderAngle); // انحراف از خط صاف

                    // اگر انحراف کمتر از 3.5 درجه باشد، سبز (تراز بیومکانیک)، در غیر این صورت قرمز
                    const isBalanced = tiltError <= 3.5;
                    const lineColor = isBalanced ? "#00e676" : "#ff3d00";

                    // ۱. رسم خط راستای شانه به شانه
                    ctx.strokeStyle = lineColor;
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.moveTo(leftShoulder.x, leftShoulder.y);
                    ctx.lineTo(rightShoulder.x, rightShoulder.y);
                    ctx.stroke();

                    // نقاط روی شانه
                    ctx.fillStyle = lineColor;
                    ctx.beginPath();
                    ctx.arc(leftShoulder.x, leftShoulder.y, 7, 0, 2 * Math.PI);
                    ctx.arc(rightShoulder.x, rightShoulder.y, 7, 0, 2 * Math.PI);
                    ctx.fill();

                    // متن وضعیت تراز شانه
                    ctx.fillStyle = lineColor;
                    ctx.font = "bold 15px Tahoma";
                    ctx.fillText(isBalanced ? "✓ تراز شانه عالی" : `خطای تراز: ${tiltError.toFixed(1)}°`, 
                                 Math.min(leftShoulder.x, rightShoulder.x), 
                                 Math.min(leftShoulder.y, rightShoulder.y) - 15);
                }

                // محاسبه زاویه آرنج کشش دست راست (12: شانه، 14: آرنج، 16: مچ)
                if (lm[12].visibility > 0.5 && lm[14].visibility > 0.5 && lm[16].visibility > 0.5) {
                    const elbowAngle = findAngle(lm[12], lm[14], lm[16]);
                    
                    // رسم خطوط بازو و ساعد
                    ctx.strokeStyle = "#2979ff";
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(lm[12].x * w, lm[12].y * h);
                    ctx.lineTo(lm[14].x * w, lm[14].y * h);
                    ctx.lineTo(lm[16].x * w, lm[16].y * h);
                    ctx.stroke();

                    // نمایش زاویه آرنج
                    ctx.fillStyle = "#ffff00";
                    ctx.font = "bold 14px Tahoma";
                    ctx.fillText(`زاویه آرنج: ${elbowAngle}°`, lm[14].x * w + 10, lm[14].y * h);
                }
            }

            // باکس اطلاعات گوشه تصویر
            ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
            ctx.fillRect(10, 10, 140, 50);

            ctx.fillStyle = "#00e676";
            ctx.font = "bold 14px Tahoma";
            ctx.direction = "ltr";
            ctx.fillText(`AI FPS: ${currentFps}`, 20, 30);
            ctx.fillStyle = "#ffffff";
            ctx.font = "11px Tahoma";
            ctx.fillText(`Mode: ${currentFacingMode}`, 20, 48);
        }
    </script>
</body>
</html>
