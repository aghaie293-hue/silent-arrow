<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Silent Arrows Analyzer — Pro</title>
<!-- Stable MediaPipe CDN -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:#0d0d12;color:#fff;font-family:Tahoma,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:10px}
  h2{font-size:17px;margin:8px 0}
  #status{font-size:13px;color:#00e5ff;min-height:20px;text-align:center;margin-bottom:6px}
  #shotIndicator{font-size:16px;font-weight:bold;color:#ffd54f;min-height:24px;margin-bottom:6px}
  .camera-container{position:relative;width:96vw;max-width:640px;aspect-ratio:3/4;background:#000;border-radius:14px;overflow:hidden;box-shadow:0 4px 24px rgba(0,229,255,.25)}
  video,canvas{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
  #flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
  #countdown{position:absolute;top:45%;left:0;right:0;text-align:center;font-size:64px;font-weight:900;color:#ff1745;text-shadow:0 0 20px #000;pointer-events:none;z-index:5}
  .controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px;width:96vw;max-width:640px}
  button{padding:12px 14px;font-size:14px;font-weight:bold;border:none;border-radius:10px;cursor:pointer;color:#fff;flex:1 1 45%}
  #btnStart{background:#00c853;flex-basis:100%}
  #btnSession{background:#2962ff;flex-basis:100%}
  #btnSnap{background:#ff6d00}
  #btnExcel{background:#00897b}
  button:disabled{opacity:.4}
  #previews{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;width:96vw;max-width:640px}
  #previews img{width:72px;height:96px;object-fit:cover;border-radius:6px;border:2px solid #00e5ff}
  table{border-collapse:collapse;font-size:11px;margin-top:10px;width:96vw;max-width:640px}
  th,td{border:1px solid #333;padding:3px 5px;text-align:center}
  th{background:#1a1a2e;color:#00e5ff}
</style>
</head>
<body>

<h2>🏹 سایلنت اررو | آنالیز بیومکانیک تیراندازی با کمان</h2>
<div id="status">برای شروع، دکمه «ورود / روشن کردن دوربین» را بزنید (فعال‌سازی صدا و دوربین).</div>
<div id="shotIndicator"></div>

<div class="camera-container">
  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="output_canvas"></canvas>
  <div id="flash"></div>
  <div id="countdown"></div>
</div>

<div class="controls">
  <button id="btnStart">🔐 ورود / روشن کردن دوربین</button>
  <button id="btnSession" disabled>🎯 شروع جلسه (۶ تیر)</button>
  <button id="btnSnap" disabled>📸 عکس فوری</button>
  <button id="btnExcel" disabled>📊 دانلود گزارش اکسل</button>
  <button id="btnHistory" style="background:#6a1b9a">🗂 تاریخچه جلسات</button>
</div>

<div id="previews"></div>
<div id="tableWrap"></div>


<!-- ================= تاریخچه جلسات (History Modal) ================= -->
<div id="historyModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;align-items:center;justify-content:center;padding:12px">
  <div style="background:#161622;border-radius:14px;padding:16px;width:96vw;max-width:640px;max-height:85vh;overflow:auto">
    <h3 style="margin:0 0 10px;color:#00e5ff;font-size:16px">🗂 تاریخچه جلسات</h3>
    <div id="historyList"></div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button id="btnHistClose" style="background:#455a64;flex:1">بستن</button>
      <button id="btnHistClear" style="background:#c62828;flex:1">🗑 پاک کردن تاریخچه</button>
    </div>
  </div>
</div>

<script>
"use strict";
/* ================= ELEMENTS ================= */
const video = document.getElementById('webcam');
const canvas = document.getElementById('output_canvas');
const ctx = canvas.getContext('2d');
const flash = document.getElementById('flash');
const countdownEl = document.getElementById('countdown');
const shotIndicator = document.getElementById('shotIndicator');
const statusEl = document.getElementById('status');
const previews = document.getElementById('previews');
const btnStart = document.getElementById('btnStart');
const btnSession = document.getElementById('btnSession');
const btnSnap = document.getElementById('btnSnap');
const btnExcel = document.getElementById('btnExcel');
const btnHistory = document.getElementById('btnHistory');

/* ================= STATE ================= */
let pose = null, cameraLoop = null, latestResults = null, running = false;
let sessionActive = false, currentShot = 0, TOTAL_SHOTS = 6;
let shotData = [], calibrated = null;

/* ================= localStorage: کالیبراسیون و تاریخچه ================= */
const CAL_KEY = 'silent_arrows_calibration';
const HIST_KEY = 'silent_arrows_history';

function saveCalibration(cal){
  try{
    if(!cal) return;
    const data = {elbowBow: cal.elbowBow, elbowDraw: cal.elbowDraw, shoulderTilt: cal.shoulderTilt, headTilt: cal.headTilt, ts: Date.now()};
    localStorage.setItem(CAL_KEY, JSON.stringify(data));
    statusEl.textContent = '💾 کالیبراسیون ذخیره شد — دفعه بعد نیاز به کالیبره مجدد نیست.';
  }catch(e){}
}
function loadCalibration(){
  try{
    const raw = localStorage.getItem(CAL_KEY);
    if(!raw) return null;
    const c = JSON.parse(raw);
    if(typeof c.elbowBow !== 'number') return null;
    return c;
  }catch(e){ return null; }
}
function loadHistory(){
  try{ return JSON.parse(localStorage.getItem(HIST_KEY) || '[]') || []; }
  catch(e){ return []; }
}
function saveHistoryEntry(entry){
  try{
    const h = loadHistory();
    h.unshift(entry);            // جدیدترین اول
    while(h.length > 50) h.pop(); // محدودیت حجم
    localStorage.setItem(HIST_KEY, JSON.stringify(h));
  }catch(e){}
}
function renderHistory(){
  const h = loadHistory();
  const list = document.getElementById('historyList');
  if(!h.length){ list.innerHTML = '<p style="color:#999;font-size:13px">هنوز جلسه‌ای ثبت نشده است.</p>'; return; }
  list.innerHTML = h.map((s,i)=>`
    <div style="border:1px solid #333;border-radius:10px;padding:8px;margin-bottom:8px;font-size:12px">
      <b style="color:#ffd54f">جلسه ${fa(h.length-i)}</b> — ${s.date}
      <div style="margin-top:4px">تیرها: ${s.shotsSummary}</div>
      <div>میانگین انحراف از کالیبراسیون: <b style="color:#00e5ff">${s.avgDev}</b></div>
      <button onclick="reloadSession(${i})" style="background:#2962ff;padding:6px 10px;font-size:12px;margin-top:6px">📥 بازیابی این جلسه</button>
    </div>`).join('');
}
function reloadSession(idx){
  const h = loadHistory();
  const s = h[idx];
  if(!s) return;
  if(s.calibration) calibrated = {...s.calibration};
  shotData = s.shots ? JSON.parse(JSON.stringify(s.shots)) : [];
  previews.innerHTML='';
  renderTable();
  document.getElementById('historyModal').style.display='none';
  statusEl.textContent = '📥 جلسه بازیابی شد — گزارش اکسل را می‌توانید دانلود کنید.';
  btnExcel.disabled = false;
}
window.reloadSession = reloadSession; // برای onclick درون مودال

const POSE_CONNECTIONS = [[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28],[27,31],[28,32],[15,17],[16,18],[15,19],[16,20],[0,11],[0,12]];

/* ================= 2. AUDIO (Web Audio API, unlocked by gesture) ================= */
let audioCtx = null;
function initAudio(){
  if(!audioCtx){
    try{
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }catch(e){ return; }
  }
  if(audioCtx.state === 'suspended') audioCtx.resume();
}
function beep(freq, dur, type='sine', vol=0.4, when=0){
  if(!audioCtx) return;
  const t = audioCtx.currentTime + when;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t); o.stop(t + dur + 0.05);
}
function soundTick(){ beep(880, 0.12, 'sine', 0.4); }                       // شمارش معکوس
function soundShot(){                                                        // صدای شلیک
  if(!audioCtx) return;
  beep(140, 0.25, 'square', 0.5);      // thwack
  beep(60, 0.3, 'sawtooth', 0.35, 0.02);
  beep(1200, 0.08, 'sine', 0.3, 0.05); // بوق تیز
  // نویز کوتاه رها شدن زه
  const len = audioCtx.sampleRate * 0.15;
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = (Math.random()*2-1) * (1 - i/len);
  const src = audioCtx.createBufferSource(); src.buffer = buf;
  const g = audioCtx.createGain(); g.gain.value = 0.35;
  const f = audioCtx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=1800;
  src.connect(f); f.connect(g); g.connect(audioCtx.destination); src.start();
}
function soundFanfare(){ [523,659,784,1047].forEach((f,i)=>beep(f,0.35,'sine',0.4,i*0.18)); }

/* ================= 1. MEDIAPIPE POSE ================= */
function buildPose(){
  if(pose) return;
  pose = new Pose({locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${f}`});
  pose.setOptions({modelComplexity:0, smoothLandmarks:true, minDetectionConfidence:0.5, minTrackingConfidence:0.5});
  pose.onResults(onResults);
}

function angle(a,b,c){ // زاویه در رأس b (درجه)
  const v1=[a.x-b.x,a.y-b.y], v2=[c.x-b.x,c.y-b.y];
  const dot=v1[0]*v2[0]+v1[1]*v2[1];
  const m=Math.hypot(...v1)*Math.hypot(...v2);
  return m ? Math.acos(Math.max(-1,Math.min(1,dot/m)))*180/Math.PI : 0;
}

function onResults(res){
  latestResults = res;
  const W = video.videoWidth || 640, H = video.videoHeight || 480;
  if(canvas.width!==W || canvas.height!==H){ canvas.width=W; canvas.height=H; }
  ctx.save();
  ctx.clearRect(0,0,W,H);
  // آینه‌ای کردن تصویر
  ctx.translate(W,0); ctx.scale(-1,1);
  if(res.image) ctx.drawImage(res.image,0,0,W,H);
  ctx.restore();

  const lm = res.poseLandmarks;
  if(!lm) return;
  const P = i => ({x: W - lm[i].x*W, y: lm[i].y*H}); // مختصات آینه‌ای
  const NEON='#39ff14', PINK='#ff2bd6', CYAN='#00e5ff', YEL='#ffe600';

  // استخوان‌ها
  ctx.lineWidth = 4; ctx.strokeStyle = NEON;
  ctx.shadowColor = NEON; ctx.shadowBlur = 10;
  POSE_CONNECTIONS.forEach(([a,b])=>{
    ctx.beginPath(); ctx.moveTo(P(a).x,P(a).y); ctx.lineTo(P(b).x,P(b).y); ctx.stroke();
  });
  // مفاصل
  [0,11,12,13,14,15,16,23,24].forEach(i=>{
    ctx.beginPath(); ctx.fillStyle=PINK; ctx.arc(P(i).x,P(i).y,6,0,7); ctx.fill();
  });
  ctx.shadowBlur = 0;

  // زوایا
  const lSh=P(11), rSh=P(12), lEl=P(13), rEl=P(15>13?15:15), lWr=P(15), rWr=P(16), head=P(0);
  const elbowAngle = angle(lSh, lEl, lWr);
  const shoulderTilt = Math.atan2(rSh.y-lSh.y, rSh.x-lSh.x)*180/Math.PI;
  const headTilt = Math.atan2(rSh.y-head.y, rSh.x-head.x)*180/Math.PI - 90;
  drawLabel(P(13).x, P(13).y, `آرنج: ${elbowAngle.toFixed(0)}°`, YEL);
  drawLabel(lSh.x, lSh.y-18, `شیب شانه: ${shoulderTilt.toFixed(0)}°`, CYAN);
  drawLabel(head.x, Math.max(20,head.y-50), `شیب سر: ${headTilt.toFixed(0)}°`, CYAN);

  // وضعیت انکر (مبدا بر اساس مچ دست کشیدن نزدیک صورت)
  const anchorDist = Math.hypot(P(15).x-head.x, P(15).y-head.y) / W;
  const anchorState = anchorDist < 0.15 ? 'انکر ✅' : (anchorDist<0.3 ? 'نزدیک انکر' : 'خارج از انکر');

  if(btnSnap.disabled){ btnSnap.disabled = false; } // اولین نتیجه pose رسید — عکس فوری فعال شد
  window.lastMetrics = {
    elbowBow: angle(lSh, P(13), lWr),            // آرنج دست کمان
    elbowDraw: angle(rSh, P(14), rWr),           // آرنج دست کشش
    shoulderTilt: shoulderTilt,
    headTilt: headTilt,
    anchor: anchorState,
    anchorDist: anchorDist
  };
}

function drawLabel(x,y,txt,color){
  ctx.font = 'bold 18px Tahoma';
  const w = ctx.measureText(txt).width + 10;
  ctx.fillStyle='rgba(0,0,0,0.65)';
  ctx.fillRect(x-w/2, y-20, w, 24);
  ctx.fillStyle=color; ctx.textAlign='center';
  ctx.fillText(txt, x, y-3);
}

/* حلقه دوربین: Camera رسمی + fallback به requestAnimationFrame */
async function startCameraLoop(){
  buildPose();
  if(typeof Camera !== 'undefined'){
    cameraLoop = new Camera(video, {
      onFrame: async () => { await pose.send({image: video}); },
      width: 640, height: 480
    });
    await cameraLoop.start().catch(err => {
      console.error('Camera start failed:', err);
      statusEl.textContent = '⚠️ خطا در راه‌اندازی حلقه دوربین — تلاش با روش جایگزین...';
      video.play().catch(()=>{});
      (function raf(){
        if(running && pose) pose.send({image: video});
        requestAnimationFrame(raf);
      })();
    });
  } else {
    await video.play().catch(()=>{});
    (function raf(){
      if(running) pose.send({image: video});
      requestAnimationFrame(raf);
    })();
  }
  running = true;
}

/* ================= شروع (.unlock همه چیز با یک کلیک) ================= */
btnStart.addEventListener('click', async ()=>{
  initAudio(); beep(660,0.1,'sine',0.3);           // 2: آنلاک صدا با اولین کلیک
  btnStart.disabled = true; btnStart.textContent='⏳ در حال اتصال...';
  try{
    const stream = await navigator.mediaDevices.getUserMedia({
      video:{facingMode:'user', width:{ideal:640}, height:{ideal:480}}, audio:false
    });
    video.srcObject = stream;
    await video.play();
    statusEl.textContent = 'در حال بارگذاری مدل هوش مصنوعی...';
    await startCameraLoop();
    statusEl.textContent = '✅ دوربین و آنالیز فعال است.';
    btnSession.disabled=false; btnExcel.disabled=false; // btnSnap تا دریافت اولین نتیجه pose غیرفعال می‌ماند
  }catch(err){
    statusEl.textContent = '❌ خطا: ' + err.name + ' — دسترسی دوربین را در تنظیمات مرورگر مجاز کنید و با HTTPS باز کنید.';
    btnStart.disabled = false; btnStart.textContent='🔄 تلاش مجدد';
  }
});

/* ================= 3. SNAPSHOT ================= */
function takeSnapshot(label){
  if(!video.videoWidth) return;
  const c = document.createElement('canvas');
  c.width = canvas.width; c.height = canvas.height;
  c.getContext('2d').drawImage(canvas, 0, 0);
  const g = c.getContext('2d');
  // کادر مشخصات
  const txt = `${label||('تیر ' + (currentShot||'-'))} | ${new Date().toLocaleString('fa-IR')}`;
  g.font='bold 22px Tahoma';
  const tw = g.measureText(txt).width + 20;
  g.fillStyle='rgba(0,0,0,0.7)'; g.fillRect(10, c.height-46, tw, 36);
  g.fillStyle='#00e5ff'; g.textAlign='left'; g.fillText(txt, 20, c.height-21);
  // فلش سفید صفحه
  flash.style.opacity = 0.9;
  setTimeout(()=>flash.style.opacity=0, 120);
  // دانلود مستقیم به گالری/Downloads موبایل
  const shotNo = currentShot || (shotData.length+1) || 1;
  const a = document.createElement('a');
  a.download = `SilentArrows_Shot_${shotNo}.png`;
  a.href = c.toDataURL('image/png');
  document.body.appendChild(a); a.click(); a.remove();
  // پیش‌نمایش
  const img = new Image(); img.src = a.href; img.style.width='72px'; img.style.height='96px';
  previews.prepend(img);
}

/* ================= 4. CSV / EXCEL ================= */
function exportCSV(){
  const header = ['شماره تیر','زمان','زاویه آرنج کمان','زاویه آرنج کشش','تراز شانه','شیب سر','وضعیت انکر','انحراف از فرم کالیبره','تمرین اصلاحی پیشنهادی (Drill)'];
  const rows = shotData.length ? shotData : [{n:'-',t:'-',bow:'-',draw:'-',sh:'-',head:'-',an:'-',dev:'-',dr:'داده‌ای ثبت نشده'}];
  const csv = '\uFEFF' + [header, ...rows.map(r=>[r.n,r.t,r.bow,r.draw,r.sh,r.head,r.an,r.dev,r.dr])]
    .map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
  a.download = 'SilentArrows_Session_Report.csv';
  document.body.appendChild(a); a.click(); a.remove();
  statusEl.textContent = '📊 فایل CSV ذخیره شد (Excel با UTF-8 و فارسی درست باز می‌کند).';
}
btnExcel.addEventListener('click', exportCSV);

/* ================= جلسه تیراندازی (شمارش معکوس + ۶ تیر) ================= */
function countdown(sec, text){
  return new Promise(res=>{
    countdownEl.textContent = text ?? (sec<=0 ? '📸' : fa(sec));
    if(sec>0) soundTick();
    setTimeout(()=>{countdownEl.textContent='';res();}, sec<=0 ? 500 : 1000);
  });
}

async function shootOne(){
  shotIndicator.textContent = `تیر ${fa(currentShot)} از ${fa(TOTAL_SHOTS)}`;
  await countdown(3); await countdown(2); await countdown(1); await countdown(0,'📸');
  soundShot();
  const m = window.lastMetrics || {elbowBow:0,elbowDraw:0,shoulderTilt:0,headTilt:0,anchor:'-',anchorDist:1};
  const dev = calibrated ? (Math.abs(m.shoulderTilt - calibrated.shoulderTilt) + Math.abs(m.headTilt - calibrated.headTilt) + Math.abs(m.elbowBow - calibrated.elbowBow) + Math.abs(m.elbowDraw - calibrated.elbowDraw)).toFixed(1)+'°' : '—';
  const drill = (m.anchorDist < 0.15)
    ? 'حفظ فرم — انکر خوب'
    : 'تمرین آینه: نگه داشتن انکر ۵ ثانیه و کشش آرنج در راستای خط شانه';
  shotData.push({n:currentShot, t:new Date().toLocaleTimeString('fa-IR'), bow:(m.elbowBow??0).toFixed(1), draw:(m.elbowDraw??0).toFixed(1), sh:(m.shoulderTilt??0).toFixed(1), head:(m.headTilt??0).toFixed(1), an:m.anchor, dev, dr:drill});
  takeSnapshot(`تیر ${fa(currentShot)}`);
  renderTable();
}


/* بارگذاری کالیبراسیون ذخیره‌شده هنگام شروع */
(function(){
  const saved = loadCalibration();
  if(saved){
    calibrated = {...saved};
    statusEl.textContent = '💾 کالیبراسیون قبلی بارگذاری شد — آماده تمرین.';
  }
})();

const fa = n => String(n).replace(/\d/g, d=>'۰۱۲۳۴۵۶۷۸۹'[d]);

btnSession.addEventListener('click', async ()=>{
  initAudio();
  if(sessionActive) return;
  sessionActive = true; btnSession.disabled = true;
  shotData = []; currentShot = 0; previews.innerHTML='';
  // کالیبراسیون با فرمت فعلی
  statusEl.textContent = 'در فرم صحیح بایستید... کالیبراسیون فرم';
  await countdown(3); await countdown(2); await countdown(1);
  calibrated = window.lastMetrics ? {...window.lastMetrics} : null;
  statusEl.textContent = calibrated ? 'کالیبره شد ✅' : 'کالیبراسیون ناموفق — ادامه بدون مبدا';
  for(let i=1;i<=TOTAL_SHOTS;i++){ currentShot = i; await shootOne(); await new Promise(r=>setTimeout(r,1500)); }
  soundFanfare();
  shotIndicator.textContent = 'جلسه تمام شد 🏁';
  saveCalibration(calibrated);
  // ذخیره خلاصه جلسه در تاریخچه
  const devs = shotData.map(r=>parseFloat(String(r.dev).replace('°',''))).filter(v=>!isNaN(v));
  const avgDev = devs.length ? (devs.reduce((a,b)=>a+b,0)/devs.length).toFixed(1)+'°' : '—';
  const summary = shotData.map(r=>`تیر${r.n}: کشش ${r.draw}° / شانه ${r.sh}°`).join(' | ');
  saveHistoryEntry({date: new Date().toLocaleString('fa-IR'), shotsSummary: summary, avgDev, shots: JSON.parse(JSON.stringify(shotData)), calibration: calibrated ? {...calibrated} : null});
  exportCSV();   // دانلود خودکار گزارش بعد از تیر ۶
  sessionActive = false; btnSession.disabled = false;
});

btnSnap.addEventListener('click', ()=>{ initAudio(); takeSnapshot('عکس فوری'); });


/* ================= مدیریت مودال تاریخچه ================= */
btnHistory.addEventListener('click', ()=>{ renderHistory(); document.getElementById('historyModal').style.display='flex'; });
document.getElementById('btnHistClose').addEventListener('click', ()=>{ document.getElementById('historyModal').style.display='none'; });
document.getElementById('btnHistClear').addEventListener('click', ()=>{
  if(confirm('همه تاریخچه جلسات پاک شود؟')){
    localStorage.removeItem(HIST_KEY);
    renderHistory();
    statusEl.textContent = '🗑 تاریخچه پاک شد.';
  }
});

function renderTable(){
  const head = ['تیر','آرنج کشش','شیب شانه','شیب سر','انکر','انحراف','Drill'];
  document.getElementById('tableWrap').innerHTML =
    '<table><tr>'+head.map(h=>`<th>${h}</th>`).join('')+'</tr>'+
    shotData.map(r=>`<tr><td>${r.n}</td><td>${r.draw}</td><td>${r.sh}</td><td>${r.head}</td><td>${r.an}</td><td>${r.dev}</td><td>${r.dr}</td></tr>`).join('')+'</table>';
}
</script>
</body>
</html>
