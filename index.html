<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silent Arrows Analyzer</title>
    <style>
        body {
            margin: 0;
            background-color: #121212;
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h2 { 
            margin-bottom: 10px; 
            font-size: 18px;
        }
        .camera-container {
            position: relative;
            width: 94vw;
            max-width: 640px;
            aspect-ratio: 3/4; /* کادر عمودی مناسب قد تیرانداز در حالت ایستاده */
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }
        video, canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 12px;
        }
        button {
            padding: 12px 20px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background-color: #00c853;
            color: white;
            box-shadow: 0 2px 8px rgba(0,200,83,0.4);
            transition: 0.2s;
        }
        button.secondary {
            background-color: #2979ff;
            box-shadow: 0 2px 8px rgba(41,121,255,0.4);
        }
        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <h2>پروژه سایلنت اررو | آنالیز بیومکانیک</h2>
    
    <div class="camera-container">
        <!-- خروجی زنده ویدیو -->
        <video id="webcam" autoplay playsinline muted></video>
        <!-- بوم خطوط راهنما و محاسبات -->
        <canvas id="output_canvas"></canvas>
    </div>

    <div class="controls">
        <button id="startBtn" onclick="startCamera()">روشن کردن دوربین</button>
        <button id="switchBtn" class="secondary" style="display: none;" onclick="toggleCamera()">تغییر دوربین 🔄</button>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('output_canvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('startBtn');
        const switchBtn = document.getElementById('switchBtn');

        let currentFacingMode = "environment"; // پیش‌فرض: دوربین پشت (محیط)
        let currentStream = null;

        // متغیرهای فریم‌ریت (FPS)
        let frameCount = 0;
        let currentFps = 0;
        let lastFpsUpdate = performance.now();

        async function startCamera() {
            // توقف استریم قبلی در صورت وجود
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            const constraints = {
                audio: false,
                video: {
                    facingMode: currentFacingMode,
                    width: { ideal: 1280, max: 1920 },
                    height: { ideal: 720, max: 1080 },
                    frameRate: { ideal: 60, min: 30 }
                }
            };

            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;
                
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    requestAnimationFrame(drawFrame);
                };

                startBtn.style.display = 'none';
                switchBtn.style.display = 'inline-block';
            } catch (err) {
                // اگر دوربین پشت در دسترس نبود، با دوربین جلو تست کن
                if (currentFacingMode === "environment") {
                    currentFacingMode = "user";
                    startCamera();
                } else {
                    alert("خطا در باز کردن دوربین: " + err);
                }
            }
        }

        function toggleCamera() {
            currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
            startCamera();
        }

        function drawFrame(now) {
            frameCount++;
            if (now - lastFpsUpdate >= 500) {
                currentFps = Math.round((frameCount * 1000) / (now - lastFpsUpdate));
                frameCount = 0;
                lastFpsUpdate = now;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const w = canvas.width;
            const h = canvas.height;

            // کادر راهنمای استقرار تیرانداز (سبز فسفری)
            ctx.strokeStyle = "rgba(0, 230, 118, 0.85)";
            ctx.lineWidth = 3;
            
            // مستطیل بالاتنه و بازوهای کشش
            ctx.strokeRect(w * 0.1, h * 0.1, w * 0.8, h * 0.8);
            
            // خط افقی راستای شانه تا شانه (Shoulder Alignment Line)
            ctx.setLineDash([6, 6]);
            ctx.beginPath();
            ctx.moveTo(w * 0.15, h * 0.4);
            ctx.lineTo(w * 0.85, h * 0.4);
            ctx.stroke();
            ctx.setLineDash([]); // ریست خط‌چین

            // کارت نمایش FPS و رزولوشن
            ctx.fillStyle = "rgba(0, 0, 0, 0.65)";
            ctx.fillRect(15, 15, 160, 60);

            ctx.fillStyle = "#00e676";
            ctx.font = "bold 15px Tahoma, sans-serif";
            ctx.direction = "ltr";
            ctx.fillText(`FPS: ${currentFps}`, 25, 38);

            ctx.fillStyle = "#ffffff";
            ctx.font = "12px Tahoma, sans-serif";
            ctx.fillText(`Mode: ${currentFacingMode === "environment" ? "Back" : "Front"}`, 25, 58);

            requestAnimationFrame(drawFrame);
        }
    </script>
</body>
</html>
